# --- Redirection HTTP -> HTTPS + challenge Certbot ---
server {
    listen 80;
    server_name mtishop.tn www.mtishop.tn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Site principal HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name mtishop.tn www.mtishop.tn;

    ssl_certificate     /etc/letsencrypt/live/mtishop.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtishop.tn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # --- API FastAPI ---
    # IMPORTANT: pas de slash final sur proxy_pass ni sur le backend URI,
    # pour préserver le préfixe /api/ (les routes FastAPI l'incluent déjà, ex: /api/health)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Fichiers uploadés (StaticFiles FastAPI, mount /uploads) ---
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend React (build statique servi par le conteneur frontend) ---
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
